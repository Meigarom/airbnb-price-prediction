# CI — roda em todo PR e em todo push para main.
#
# O portão é o teste de equivalência (€0,01) entre o pipeline do notebook e a
# classe de produção: se ele falhar, não entra na main. Um erro de transcrição
# numa feature produz predições plausíveis e erradas, indefinidamente — esse é
# o tipo de defeito que não aparece em nenhum log.
#
# Plano: docs/plans/14_deploy_aws.md §7.1

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela execuções antigas do mesmo branch: num push em sequência, só a
# última interessa, e as anteriores só consomem minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # necessário para o OIDC da AWS

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Python 3.11: é a versão em que os pickles foram gerados. Carregar um
      # pickle de scikit-learn/LightGBM noutra versão de Python emite aviso e,
      # em casos piores, falha — a API confere isso no startup.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # ruff está pinado no requirements.txt: a versão do lint precisa ser
          # a mesma validada localmente, senão o CI falha por regras novas.
          pip install -r requirements.txt

      - name: Lint
        run: ruff check app/ tests/

      # Os artefatos NÃO estão no Git (vivem no S3), e sem eles 17 dos 19
      # testes falham — incluindo o de equivalência, que é o portão. Por isso
      # até o CI precisa de credencial AWS.
      # O erro nativo do configure-aws-credentials quando o secret esta vazio
      # ou malformado e "Not authorized to perform sts:AssumeRoleWithWebIdentity"
      # -- identico ao de um provedor OIDC ausente ou de uma trust policy
      # errada. Tres causas, uma mensagem so. Esta verificacao separa a mais
      # banal das outras antes de gastar um ciclo de diagnostico.
      - name: Conferir o secret AWS_DEPLOY_ROLE_ARN
        env:
          ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ARN" ]; then
            echo "::error::O secret AWS_DEPLOY_ROLE_ARN esta VAZIO ou nao existe."
            echo "Configure em Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Espaco ou quebra de linha invisivel no inicio/fim: passa despercebido
          # na tela do GitHub e quebra o AssumeRole. Detectado comparando o
          # valor com ele mesmo sem espacos nas bordas.
          LIMPO="$(printf '%s' "$ARN" | tr -d '[:space:]')"
          if [ "$LIMPO" != "$ARN" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN contem espaco ou quebra de linha."
            echo "Reedite o secret colando o ARN sem espacos nas bordas."
            exit 1
          fi

          ESPERADO='^arn:aws:iam::[0-9]{12}:role/.+$'
          if ! printf '%s' "$ARN" | grep -qE "$ESPERADO"; then
            echo "::error::AWS_DEPLOY_ROLE_ARN nao parece um ARN de role."
            echo "Esperado: arn:aws:iam::<conta>:role/<nome>"
            echo "Recebido: ${#ARN} caracteres, comecando por '$(printf '%.12s' "$ARN")...'"
            echo "Causas comuns: colar o ARN do usuario ou do provedor OIDC,"
            echo "colar so o nome da role, ou deixar espaco/quebra de linha."
            exit 1
          fi

          echo "Formato do ARN OK (${#ARN} caracteres)."

      - name: Autenticar na AWS (OIDC, sem chave estática)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Baixar artefatos do S3
        run: |
          mkdir -p app/models
          aws s3 cp s3://precificacao-airbnb-ams/models/v1/model.pkl     app/models/
          aws s3 cp s3://precificacao-airbnb-ams/models/v1/artifacts.pkl app/models/

      - name: Testes
        run: pytest tests/ -v

  # Build de validação: constrói a imagem para garantir que o Dockerfile não
  # quebrou, mas NÃO publica. Publicar é responsabilidade do deploy.
  build:
    runs-on: ubuntu-latest
    needs: testes

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # O runner é x86 e a imagem é arm64, então o build aqui é emulado por
      # QEMU — lento, mas é só validação. O deploy real usa o mesmo caminho,
      # e a alternativa (runner arm64) não está disponível no plano gratuito.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      # O Dockerfile faz COPY dos pickles, que não estão no repositório. Sem
      # baixá-los o build falha em COPY — não por erro de Dockerfile, mas por
      # arquivo ausente, que é um falso negativo caro de diagnosticar.
      - name: Baixar artefatos do S3
        run: |
          mkdir -p app/models
          aws s3 cp s3://precificacao-airbnb-ams/models/v1/model.pkl     app/models/
          aws s3 cp s3://precificacao-airbnb-ams/models/v1/artifacts.pkl app/models/

      - name: Build arm64 (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          # `provenance: false` é obrigatório: sem isso o BuildKit anexa uma
          # attestation e promove o manifesto a OCI image index, que o Lambda
          # RECUSA. Foi o que quebrou o primeiro deploy manual.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
